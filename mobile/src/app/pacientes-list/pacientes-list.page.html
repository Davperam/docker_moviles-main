<ion-header>
  <ion-toolbar>
    <ion-title>Lista de pacientes</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let paciente of pacientes">
      <ion-label class="ion-text-wrap">
        <h2>{{ paciente.nombre }} {{ paciente.paterno }} {{ paciente.materno }}</h2>
        <p>{{ paciente.nacimiento }}</p>
      </ion-label>
      <ion-button slot="end" color="warning" [routerLink]="['/pacientes-view', paciente.idpaciente]">
        <ion-icon name="eye-outline"></ion-icon>
      </ion-button>
    </ion-item>
  </ion-list>

  <ion-fab slot="fixed" vertical="bottom" horizontal="center">
    <ion-fab-button (click)="nuevoPaciente()" aria-label="Nuevo paciente">
        <ion-icon name="add"></ion-icon>
    </ion-fab-button>
</ion-fab>

</ion-content>
