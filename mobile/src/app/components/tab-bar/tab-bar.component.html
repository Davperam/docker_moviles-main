<ion-footer class="ion-no-border">
  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="pacientes" [routerLink]="['/pacientes-list']" [selected]="tabActivo === 'pacientes'">
      <ion-icon name="people"></ion-icon>
      <ion-label>Pacientes</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="citas" [routerLink]="['/citas-list']" [selected]="tabActivo === 'citas'">
      <ion-icon name="calendar"></ion-icon>
      <ion-label>Citas</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="alergias" [routerLink]="['/alergia-list']" [selected]="tabActivo === 'alergias'">
      <ion-icon name="bandage"></ion-icon>
      <ion-label>Alergias</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="ajustes" [routerLink]="['/settings']" [selected]="tabActivo === 'ajustes'">
      <ion-icon name="settings"></ion-icon>
      <ion-label>Ajustes</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-footer>
