<ion-header [translucent]="true">
  <ion-toolbar [color]="color">
    <ion-buttons slot="start">
    <ion-menu-button menu="principal" aria-label="Abrir menú"></ion-menu-button>
  </ion-buttons>
  
  <!-- Titulo de las páginas -->
    <ion-title class="ion-text-center">{{ nombre }}</ion-title>

  <!-- Logo de la app -->
    <ion-buttons slot="end" class="toolbar-logo-container">
      <img src="assets/icon/LogoDental.png" alt="DentiControl Logo" class="toolbar-logo" />
    </ion-buttons>

    <ng-content></ng-content>
  </ion-toolbar>
</ion-header>
