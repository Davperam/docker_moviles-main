<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button fill="solid" (click)="cerrarModal()">
        Cancelar
      </ion-button>
    </ion-buttons>
    <ion-title>
      {{ esEdicion ? 'Editar alergia' : 'Nueva alergia' }}
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div *ngIf="cargando" class="ion-text-center ion-padding">
    <ion-spinner></ion-spinner>
    <p>Cargando alergia...</p>
  </div>

  <form *ngIf="alergiaForm && !cargando" [formGroup]="alergiaForm" (ngSubmit)="guardarAlergia()">
    <ion-list>
      <ion-item>
        <ion-input label="Nombre" labelPlacement="stacked" type="text" formControlName="nombre" maxlength="150"></ion-input>
      </ion-item>
      <ion-note color="danger" *ngIf="getError('nombre') as error">
        {{ error }}
      </ion-note>

      <ion-item>
        <ion-input label="Descripción" labelPlacement="stacked" type="text" formControlName="descripcion" maxlength="255"></ion-input>
      </ion-item>
      <ion-note color="danger" *ngIf="getError('descripcion') as error">
        {{ error }}
      </ion-note>
    </ion-list>

    <ion-button fill="solid" expand="block" type="submit" class="ion-margin-top" [disabled]="guardando || cargando">
      {{ guardando ? 'Guardando...' : (esEdicion ? 'Actualizar Alergia' : 'Guardar Alergia') }}
    </ion-button>
  </form>
</ion-content>
