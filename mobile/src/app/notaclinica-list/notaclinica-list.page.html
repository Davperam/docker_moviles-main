<ion-header>
  <ion-toolbar color="prueba">
    <ion-title>Lista de notas clínicas</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let nota of notas">
      <ion-label class="ion-text-wrap">
        <h2>{{ nota.idexpediente }}</h2>
        <p>{{ nota.fecha }}</p>
      </ion-label>
      <ion-button slot="end" color="warning" [routerLink]="['/notaclinica-view', nota.idnota]">
        <ion-icon name="eye-outline"></ion-icon>
      </ion-button>
    </ion-item>
  </ion-list>
</ion-content>
