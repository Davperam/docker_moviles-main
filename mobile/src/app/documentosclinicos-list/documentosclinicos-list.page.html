<app-toolbar [nombre]="titulo" color="prueba">
</app-toolbar>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let documento of documentos">
      <ion-label class="ion-text-wrap">
        <h2>{{ documento.nombredocumento }}</h2>
        <p>{{ documento.fechacarga }}</p>
      </ion-label>
      <ion-button slot="end" color="primary" [routerLink]="['/documentosclinicos-view', documento.iddocumento]">
        <ion-icon name="eye-outline"></ion-icon>
      </ion-button>

      <ion-button fill="solid" color="warning" (click)="editarDocumento(documento.iddocumento)" aria-label="Editar documento clínico">
        <ion-icon slot="icon-only" name="pencil"></ion-icon>
      </ion-button>

      <ion-button fill="solid" color="danger" (click)="confirmarEliminar(documento.iddocumento, documento.nombredocumento)" aria-label="Eliminar documento clínico">
        <ion-icon slot="icon-only" name="trash"></ion-icon>
      </ion-button>

    </ion-item>
  </ion-list>


  <ion-fab slot="fixed" vertical="bottom" horizontal="center">
    <ion-fab-button (click)="nuevoDocumento()" aria-label="Nuevo documento clínico">
        <ion-icon name="add"></ion-icon>
    </ion-fab-button>
</ion-fab>

</ion-content>
