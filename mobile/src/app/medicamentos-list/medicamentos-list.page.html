<app-toolbar [nombre]="titulo">
  
</app-toolbar>

<ion-content>
  <ion-searchbar [value]="busqueda" [debounce]="300" (ionInput)="handleInput($event)" placeholder="Buscar medicamento" aria-label="Buscar medicamento"></ion-searchbar>
<p class="ion-padding" *ngIf="total === 0">No se encontraron medicamentos.</p>
  <ion-list>
    <ion-item *ngFor="let medicamento of medicamentos">
      <ion-label class="ion-text-wrap">
        <h2>{{ medicamento.nombre }}</h2>
      </ion-label>
      <ion-button slot="end" color="primary" [routerLink]="['/medicamentos-view', medicamento.idmedicamento]">
        <ion-icon name="eye-outline"></ion-icon>
      </ion-button>
<!-- Editar medicamento -->
      <ion-button fill="solid" color="warning" (click)="editarMedicamento(medicamento.idmedicamento)" aria-label="Editar medicamento">
        <ion-icon slot="icon-only" name="pencil"></ion-icon>
      </ion-button>
<!-- Eliminar medicamento -->
      <ion-button fill="solid" color="danger" (click)="confirmarEliminar(medicamento.idmedicamento, medicamento.nombre)" aria-label="Eliminar medicamento">
        <ion-icon slot="icon-only" name="trash"></ion-icon>
      </ion-button>
      
    </ion-item>
  </ion-list>

  <!-- Paginación -->
   <app-paginacion
    [total]="total" [porPagina]="porPagina" [paginaActual]="paginaActual" [maxPaginasVisibles]="5" (paginaCambio)="cambiarPagina($event)">
  </app-paginacion>

  <ion-fab slot="fixed" vertical="bottom" horizontal="center">
      <ion-fab-button (click)="nuevoMedicamento()" aria-label="Nuevo medicamento">
          <ion-icon name="add"></ion-icon>
      </ion-fab-button>
  </ion-fab>

</ion-content>
