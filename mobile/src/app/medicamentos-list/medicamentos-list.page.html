<ion-header>
  <ion-toolbar>
    <ion-title>Lista de medicamentos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let medicamento of medicamentos">
      <ion-label class="ion-text-wrap">
        <h2>{{ medicamento.nombre }}</h2>
      </ion-label>
      <ion-button slot="end" color="warning" [routerLink]="['/medicamentos-view', medicamento.idmedicamento]">
        <ion-icon name="eye-outline"></ion-icon>
      </ion-button>
    </ion-item>
  </ion-list>
</ion-content>
