<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button fill="solid" (click)="cerrarModal()" [disabled]="guardando || cargando">
        Cancelar
      </ion-button>
    </ion-buttons>

    <!-- Título dinámico -->
    <ion-title>{{ esEdicion ? 'Editar servicio' : 'Nuevo servicio' }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <!-- Spinner de carga cuando se abre en modo edición -->
  <div *ngIf="cargando" class="ion-text-center ion-padding">
    <ion-spinner></ion-spinner>
    <p>Cargando datos del servicio...</p>
  </div>

  <form *ngIf="servicioForm && !cargando" [formGroup]="servicioForm" (ngSubmit)="guardarServicio()">
    <ion-list>
      <!-- Nombre -->
      <ion-item>
        <ion-input label="Nombre del servicio" labelPlacement="stacked" type="text" formControlName="nombre" maxlength="150"></ion-input>
      </ion-item>
      <ion-note color="danger" *ngIf="getError('nombre') as error">
        {{ error }}
      </ion-note>

      <!-- Descripción -->
      <ion-item>
        <ion-textarea label="Descripción" labelPlacement="stacked" formControlName="descripcion" autoGrow="true" placeholder="Detalles del tratamiento..."></ion-textarea>
      </ion-item>
      <ion-note color="danger" *ngIf="getError('descripcion') as error">
        {{ error }}
      </ion-note>

      <!-- Precio -->
      <ion-item>
        <ion-input label="Precio ($)" labelPlacement="stacked" type="number" formControlName="precio" min="0" placeholder="0.00"></ion-input>
      </ion-item>
      <ion-note color="danger" *ngIf="getError('precio') as error">
        {{ error }}
      </ion-note>

      <!-- Duración -->
      <ion-item>
        <ion-input label="Duración (en minutos)" labelPlacement="stacked" type="number" formControlName="duracion" min="1" placeholder="Ej. 45"></ion-input>
      </ion-item>
      <ion-note color="danger" *ngIf="getError('duracion') as error">
        {{ error }}
      </ion-note>
    </ion-list>

    <!-- Botón dinámico de Guardado/Actualización -->
    <ion-button fill="solid" expand="block" type="submit" class="ion-margin-top" [disabled]="guardando || cargando">
      {{ guardando ? 'Guardando...' : (esEdicion ? 'Actualizar Servicio' : 'Guardar Servicio') }}
    </ion-button>

  </form>
</ion-content>
