<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button fill="solid" (click)="cerrarModal()">
        Cancelar
      </ion-button>
    </ion-buttons>
    <ion-title>Nuevo servicio</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form *ngIf="servicioForm" [formGroup]="servicioForm" (ngSubmit)="guardarServicio()">
    <ion-list>
      <!-- Nombre -->
      <ion-item>
        <ion-input label="Nombre del servicio" labelPlacement="stacked" type="text" formControlName="nombre" maxlength="150"></ion-input>
      </ion-item>
      <ion-note color="danger" *ngIf="getError('nombre') as error">
        {{ error }}
      </ion-note>

      <!-- Descripción -->
      <ion-item>
        <ion-textarea label="Descripción" labelPlacement="stacked" formControlName="descripcion" autoGrow="true" placeholder="Detalles del tratamiento..."></ion-textarea>
      </ion-item>
      <ion-note color="danger" *ngIf="getError('descripcion') as error">
        {{ error }}
      </ion-note>

      <!-- Precio -->
      <ion-item>
        <ion-input label="Precio ($)" labelPlacement="stacked" type="number" formControlName="precio" min="0" placeholder="0.00"></ion-input>
      </ion-item>
      <ion-note color="danger" *ngIf="getError('precio') as error">
        {{ error }}
      </ion-note>

      <!-- Duración -->
      <ion-item>
        <ion-input label="Duración (HH:MM:SS)" labelPlacement="stacked" type="text" formControlName="duracion" placeholder="01:30:00"></ion-input>
      </ion-item>
      <ion-note color="danger" *ngIf="getError('duracion') as error">
        {{ error }}
      </ion-note>

    <ion-button fill="solid" expand="block" type="submit" class="ion-margin-top" [disabled]="guardando">
      {{ guardando ? 'Guardando...' : 'Guardar Servicio' }}
    </ion-button>
    </ion-list>
  </form>
</ion-content>
