<ion-content class="dc-content" [fullscreen]="true">
  <!-- Cabecera curva con isotipo y marca -->
  <div class="dc-hero">
    <div class="dc-hero-inner">
      <img
        src="assets/icon/Img-login.png"
        alt="DentiControl"
        class="dc-logo"
      />
    </div>
  </div>

  <!-- Formulario inferior -->
  <div class="dc-form-container">
    <form [formGroup]="form" (ngSubmit)="ingresar()" novalidate>
      <ion-item lines="full" class="dc-item">
        <ion-icon slot="start" name="person-outline" class="dc-icon"></ion-icon>
        <ion-input
          type="email"
          autocomplete="username"
          placeholder="Usuario / Correo"
          aria-label="Usuario o correo"
          formControlName="email">
        </ion-input>
      </ion-item>

      <ion-item lines="full" class="dc-item">
        <ion-icon slot="start" name="lock-closed-outline" class="dc-icon"></ion-icon>
        <ion-input
          [type]="verPassword ? 'text' : 'password'"
          autocomplete="current-password"
          placeholder="Contraseña"
          aria-label="Contraseña"
          formControlName="password">
        </ion-input>
        <ion-button
          fill="clear"
          slot="end"
          type="button"
          class="dc-eye-btn"
          (click)="verPassword = !verPassword"
          aria-label="Mostrar u ocultar contraseña">
          <ion-icon
            slot="icon-only"
            [name]="verPassword ? 'eye-off-outline' : 'eye-outline'">
          </ion-icon>
        </ion-button>
      </ion-item>

      <ion-note color="danger" class="dc-feedback" *ngIf="form.touched && form.invalid">
        Escribe un correo válido y tu contraseña.
      </ion-note>

      <div class="dc-feedback dc-status" *ngIf="mensaje" role="status">
        {{ mensaje }}
      </div>

      <ion-button
        expand="block"
        shape="round"
        type="submit"
        class="dc-submit-btn"
        [disabled]="enviando">
        {{ enviando ? 'Ingresando...' : 'Iniciar Sesión' }}
      </ion-button>
    </form>

    <div class="dc-links">
      <a routerLink="/registro">Regístrate</a>
      <a routerLink="/recuperar-password">¿Olvidaste tu contraseña?</a>
    </div>
  </div>
</ion-content>
