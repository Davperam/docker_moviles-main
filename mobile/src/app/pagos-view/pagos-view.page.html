<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/pagos-list"></ion-back-button>
    </ion-buttons>
    <ion-title>Descripción del pago</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-text color="danger" *ngIf="mensajeError">
    <p class="ion-padding">{{ mensajeError }}</p>
  </ion-text>
  
  <ion-card *ngIf="pago as detalle">
    <ion-card-header>
      <ion-card-title>{{ detalle.idcita }}</ion-card-title>
      <ion-card-subtitle>{{ detalle.idmetodopago }}</ion-card-subtitle>
      <ion-card-subtitle>Total $ {{ detalle.total }}</ion-card-subtitle>
      <ion-card-subtitle>Observaciones # {{ detalle.observaciones }}</ion-card-subtitle>
      <ion-card-subtitle>Estado # {{ detalle.estado }}</ion-card-subtitle>
      <ion-card-subtitle>Fecha # {{ detalle.fechapago }}</ion-card-subtitle>
    </ion-card-header>

  </ion-card>
</ion-content>
