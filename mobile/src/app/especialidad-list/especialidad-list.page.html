<ion-header>
  <ion-toolbar>
    <ion-title>Lista de especialidades</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let especialidad of especialidades">
      <ion-label class="ion-text-wrap">
        <h2>{{ especialidad.nombre }}</h2>
      </ion-label>
      <ion-button slot="end" color="warning" [routerLink]="['/especialidad-view', especialidad.idespecialidad]">
        <ion-icon name="eye-outline"></ion-icon>
      </ion-button>
    </ion-item>
  </ion-list>
</ion-content>
