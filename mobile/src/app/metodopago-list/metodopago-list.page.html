<ion-header>
  <ion-toolbar color="prueba">
    <ion-title>Lista de metodos de pago</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let metodopago of metodosPago">
      <ion-label class="ion-text-wrap">
        <h2>{{ metodopago.nombre }}</h2>
        <p>{{ metodopago.descripcion }}</p>
      </ion-label>
      <ion-button slot="end" color="warning" [routerLink]="['/metodopago-view', metodopago.idmetodopago]">
        <ion-icon name="eye-outline"></ion-icon>
      </ion-button>
    </ion-item>
  </ion-list>
</ion-content>
