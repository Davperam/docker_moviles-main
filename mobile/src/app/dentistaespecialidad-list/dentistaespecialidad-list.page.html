<ion-header>
  <ion-toolbar>
    <ion-title>Lista de especialidades</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let dentistaespecialidad of dentistaespecialidad">
      <ion-label class="ion-text-wrap">
        <h2>{{ dentistaespecialidad.idespecialidad }}</h2>
        <p>{{ dentistaespecialidad.iddentista }}</p>
      </ion-label>
      <ion-button slot="end" color="warning" [routerLink]="['/dentistaespecialidad-view', dentistaespecialidad.iddentistaespecialidad]">
        <ion-icon name="eye-outline"></ion-icon>
      </ion-button>
    </ion-item>
  </ion-list>
</ion-content>
