<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/servicios-list"></ion-back-button>
    </ion-buttons>
    <ion-title>Descripción del servicio</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-text color="danger" *ngIf="mensajeError">
    <p class="ion-padding">{{ mensajeError }}</p>
  </ion-text>
  
  <ion-card *ngIf="servicio as detalle">
    <ion-card-header>
      <ion-card-title>{{ detalle.nombre }}</ion-card-title>
      <ion-card-subtitle>Descripcion {{ detalle.descripcion }}</ion-card-subtitle>
      <ion-card-subtitle>Precio ${{ detalle.precio }}</ion-card-subtitle>
      <ion-card-subtitle>Duracion: {{ detalle.duracion }} min</ion-card-subtitle>
      <ion-card-subtitle>{{ detalle.activo }}</ion-card-subtitle>
    </ion-card-header>

  </ion-card>
</ion-content>
