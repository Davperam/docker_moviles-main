<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button fill="solid" (click)="cerrarModal()">
        Cancelar
      </ion-button>
    </ion-buttons>
    <ion-title>
      {{ esEdicion ? 'Editar odontograma' : 'Nuevo odontograma' }}
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div *ngIf="cargando" class="ion-text-center ion-padding">
    <ion-spinner></ion-spinner>
    <p>Cargando odontograma...</p>
  </div>

  <form *ngIf="odontogramasForm && !cargando" [formGroup]="odontogramasForm" (ngSubmit)="guardarOdontogramas()">
    <ion-list>
      <!-- Diente -->
      <ion-item>
        <ion-input label="Diente" labelPlacement="stacked" type="number" formControlName="diente" min="0"></ion-input>
      </ion-item>
      <ion-note color="danger" *ngIf="getError('diente') as error">
        {{ error }}
      </ion-note>

      <!-- Observaciones -->
      <ion-item>
        <ion-textarea label="Observaciones" labelPlacement="stacked" formControlName="observaciones" autoGrow="true" maxlength="150"></ion-textarea>
      </ion-item>
      <ion-note color="danger" *ngIf="getError('observaciones') as error">
        {{ error }}
      </ion-note>

      <!-- Tratamiento -->
      <ion-item>
        <ion-input label="Tratamiento" labelPlacement="stacked" type="text" formControlName="tratamiento" maxlength="150"></ion-input>
      </ion-item>
      <ion-note color="danger" *ngIf="getError('tratamiento') as error">
        {{ error }}
      </ion-note>

      <!-- Estado -->
      <ion-item>
        <ion-input label="Estado" labelPlacement="stacked" type="text" formControlName="estado" maxlength="150"></ion-input>
      </ion-item>
      <ion-note color="danger" *ngIf="getError('estado') as error">
        {{ error }}
      </ion-note>

      <!-- Id Expediente -->
      <ion-item>
        <ion-input label="Id Expediente" labelPlacement="stacked" type="number" formControlName="idexpediente" min="0"></ion-input>
      </ion-item>
      <ion-note color="danger" *ngIf="getError('idexpediente') as error">
        {{ error }}
      </ion-note>
    </ion-list>

    <ion-button fill="solid" expand="block" type="submit" class="ion-margin-top" [disabled]="guardando || cargando">
      {{ guardando ? 'Guardando...' : (esEdicion ? 'Actualizar Odontograma' : 'Guardar Odontograma') }}
    </ion-button>
  </form>
</ion-content>
