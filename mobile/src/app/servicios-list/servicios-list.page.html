<app-toolbar [nombre]="titulo">
  
</app-toolbar>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let servicio of servicios">
      <ion-label class="ion-text-wrap">
        <h2>{{ servicio.nombre }}</h2>
        <p>Precio: ${{ servicio.precio | number:'1.2-2' }}</p>
      </ion-label>
      <!-- Detalles -->
      <ion-button slot="end" color="primary" [routerLink]="['/servicios-view', servicio.idservicio]">
        <ion-icon name="eye-outline"></ion-icon>
      </ion-button>
      <!-- Actualizar -->
       <ion-button fill="solid" color="warning" (click)="editarServicio(servicio.idservicio)" aria-label="Editar servicio">
        <ion-icon slot="icon-only" name="pencil"></ion-icon>
      </ion-button>
      <!-- Eliminar -->
       <ion-button fill="solid" color="danger" (click)="confirmarEliminar(servicio.idservicio, servicio.nombre)" aria-label="Eliminar servicio">
        <ion-icon slot="icon-only" name="trash"></ion-icon>
      </ion-button>
    </ion-item>
  </ion-list>

  <ion-fab slot="fixed" vertical="bottom" horizontal="center">
    <ion-fab-button (click)="nuevoServicio()" aria-label="Nuevo servicio">
        <ion-icon name="add"></ion-icon>
    </ion-fab-button>
</ion-fab>

</ion-content>

<!-- Menú Rápido Reutilizable -->
<app-tab-bar tabActivo="Inicio"></app-tab-bar>
