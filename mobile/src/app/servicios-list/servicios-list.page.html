<ion-header>
  <ion-toolbar color="prueba">
    <ion-title>Lista de servicios</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let servicio of servicios">
      <ion-label class="ion-text-wrap">
        <h2>{{ servicio.nombre }}</h2>
        <p>Precio: ${{ servicio.precio | number:'1.2-2' }}</p>
      </ion-label>
      <ion-button slot="end" color="warning" [routerLink]="['/servicios-view', servicio.idservicio]">
        <ion-icon name="eye-outline"></ion-icon>
      </ion-button>
    </ion-item>
  </ion-list>

  <ion-fab slot="fixed" vertical="bottom" horizontal="center">
    <ion-fab-button (click)="nuevoServicio()" aria-label="Nuevo servicio">
        <ion-icon name="add"></ion-icon>
    </ion-fab-button>
</ion-fab>

</ion-content>
