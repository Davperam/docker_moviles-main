<app-toolbar [nombre]="titulo" >
</app-toolbar>

<ion-content>
  <ion-searchbar [value]="busqueda" [debounce]="300" (ionInput)="handleInput($event)" placeholder="Buscar productos" aria-label="Buscar productos"></ion-searchbar>
  <p class="ion-padding" *ngIf="total === 0">No se encontraron alergias.</p>
  <ion-list>
    <ion-item *ngFor="let alergia of alergias">
      <ion-label class="ion-text-wrap">
        <h2>{{ alergia.nombre }}</h2>
      </ion-label>
      <ion-button class="boton-producto" slot="end" color="primary" [routerLink]="['/alergia-view', alergia.idalergia]">
        <ion-icon name="eye-outline"></ion-icon>
      </ion-button>
<!-- Boton de editar -->
      <ion-button class="boton-producto" fill="solid" color="warning" (click)="editarAlergia(alergia.idalergia)" aria-label="Editar alergia">
        <ion-icon slot="icon-only" name="pencil"></ion-icon>
      </ion-button>

      <ion-button class="boton-producto" fill="solid" color="danger" (click)="confirmarEliminar(alergia.idalergia, alergia.nombre)" aria-label="Eliminar alergia">
        <ion-icon slot="icon-only" name="trash"></ion-icon>
      </ion-button>

    </ion-item>
  </ion-list>
  <!-- Paginación -->
  <app-paginacion [total]="total" [porPagina]="porPagina" [paginaActual]="paginaActual" [maxPaginasVisibles]="5" (paginaCambio)="cambiarPagina($event)"></app-paginacion>

      <!-- Botón de agregar alergia -->
      <ion-fab slot="fixed" vertical="bottom" horizontal="center">
        <ion-fab-button (click)="nuevaAlergia()" aria-label="Nueva alergia">
          <ion-icon name="add"></ion-icon>
        </ion-fab-button>
      </ion-fab>
  
</ion-content>
