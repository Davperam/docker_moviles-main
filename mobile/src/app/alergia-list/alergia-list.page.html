<ion-header>
  <ion-toolbar>
    <ion-title>Alergias</ion-title>
    <ion-buttons slot="end">
  <ion-button fill="solid" (click)="nuevaAlergia()" aria-label="Nueva alergia">
    <ion-icon slot="icon-only" name="add"></ion-icon>
  </ion-button>
</ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let alergia of alergias">
      <ion-label class="ion-text-wrap">
        <h2>{{ alergia.nombre }}</h2>
      </ion-label>
      <ion-button slot="end" color="warning" [routerLink]="['/alergia-view', alergia.idalergia]">
        <ion-icon name="eye-outline"></ion-icon>
      </ion-button>
    </ion-item>
  </ion-list>
  <app-paginacion [total]="total" [porPagina]="porPagina" [paginaActual]="paginaActual" [maxPaginasVisibles]="5" (paginaCambio)="cambiarPagina($event)"></app-paginacion>
</ion-content>
