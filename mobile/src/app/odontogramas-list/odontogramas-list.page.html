<ion-header>
  <ion-toolbar>
    <ion-title>Lista de odontogramas</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let odontograma of odontogramas">
      <ion-label class="ion-text-wrap">
        <h2>{{ odontograma.idexpediente }}</h2>
        <p>{{ odontograma.fecharegistro }}</p>
      </ion-label>
      <ion-button slot="end" color="warning" [routerLink]="['/odontogramas-view', odontograma.idodontograma]">
        <ion-icon name="eye-outline"></ion-icon>
      </ion-button>
    </ion-item>
  </ion-list>

  <ion-fab slot="fixed" vertical="bottom" horizontal="center">
    <ion-fab-button (click)="nuevoOdontograma()" aria-label="Nuevo odontograma">
        <ion-icon name="add"></ion-icon>
    </ion-fab-button>
</ion-fab>

</ion-content>
