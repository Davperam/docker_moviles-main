<ion-header>
  <ion-toolbar>
    <ion-title>Lista de pagos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let pago of pagos">
      <ion-label class="ion-text-wrap">
        <h2>{{ pago.idcita }}</h2>
        <p>{{ pago.estado }} </p>
      </ion-label>
      <ion-button slot="end" color="warning" [routerLink]="['/pagos-view', pago.idpago]">
        <ion-icon name="eye-outline"></ion-icon>
      </ion-button>
    </ion-item>
  </ion-list>
</ion-content>
