<app-toolbar [nombre]="titulo" >
</app-toolbar>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let pago of pagos">
      <ion-label class="ion-text-wrap">
        <h2>{{ pago.idcita}}</h2>
        <p>{{ pago.estado }} </p>
      </ion-label>
      <ion-button slot="end" color="warning" [routerLink]="['/pagos-view', pago.idpago]">
        <ion-icon name="eye-outline"></ion-icon>
      </ion-button>
    </ion-item>
  </ion-list>

  <app-paginacion
  [total]="total"
  [porPagina]="porPagina"
  [paginaActual]="paginaActual"
  [maxPaginasVisibles]="5"
  (paginaCambio)="cambiarPagina($event)">
</app-paginacion>

  <ion-fab slot="fixed" vertical="bottom" horizontal="center">
    <ion-fab-button (click)="nuevoPago()" aria-label="Nuevo pago">
        <ion-icon name="add"></ion-icon>
    </ion-fab-button>
</ion-fab>

</ion-content>
