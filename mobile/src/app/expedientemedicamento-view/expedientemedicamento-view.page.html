<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/expedientemedicamento-list"></ion-back-button>
    </ion-buttons>
    <ion-title>Descripción del expediente de medicamento</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-text color="danger" *ngIf="mensajeError">
    <p class="ion-padding">{{ mensajeError }}</p>
  </ion-text>
  
  <ion-card *ngIf="expedientemedicamento as detalle">
    <ion-card-header>
      <ion-card-title>{{ detalle.idexpediente }}</ion-card-title>
      <ion-card-subtitle>Medicamento # {{ detalle.idmedicamento }}</ion-card-subtitle>
    </ion-card-header>

  </ion-card>
</ion-content>
