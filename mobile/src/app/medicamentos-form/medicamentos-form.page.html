<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button fill="solid" (click)="cerrarModal()">
        Cancelar
      </ion-button>
    </ion-buttons>
    <ion-title>{{ esEdicion ? 'Editar medicamento' : 'Nuevo medicamento' }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div *ngIf="cargando" class="ion-text-center ion-padding">
    <ion-spinner></ion-spinner>
    <p>Cargando medicamento...</p>
  </div>

  <form *ngIf="medicamentoForm && !cargando" [formGroup]="medicamentoForm" (ngSubmit)="guardarMedicamento()">
    <ion-list>
      <ion-item>
        <ion-input label="Nombre" labelPlacement="stacked" type="text" formControlName="nombre" maxlength="150"></ion-input>
      </ion-item>
      <ion-note color="danger" *ngIf="getError('nombre') as error">
        {{ error }}
      </ion-note>

      <ion-item>
        <ion-textarea label="Descripción" labelPlacement="stacked" formControlName="descripcion" autoGrow="true"></ion-textarea>
      </ion-item>
      <ion-note color="danger" *ngIf="getError('descripcion') as error">
        {{ error }}
      </ion-note>

       <!-- Activo -->
      <ion-item>
        <ion-input label="Activo (1 o 0)" labelPlacement="stacked" type="number" formControlName="activo" min="0" max="1"></ion-input>
      </ion-item>
      <ion-note color="danger" *ngIf="getError('activo') as error">
        {{ error }}
      </ion-note>

    </ion-list>

    <ion-button fill="solid" expand="block" type="submit" class="ion-margin-top" [disabled]="guardando || cargando">
      {{ guardando ? 'Guardando...' : (esEdicion ? 'Actualizar Medicamento' : 'Guardar') }}
    </ion-button>
  </form>
</ion-content>
