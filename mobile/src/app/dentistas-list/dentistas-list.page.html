<ion-header>
  <ion-toolbar>
    <ion-title>Lista de dentistas</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let dentista of dentistas">
      <ion-label class="ion-text-wrap">
        <h2>{{ dentista.nombre }} {{ dentista.paterno }}</h2>
        <p> Cedula: {{ dentista.cedula }}</p>
      </ion-label>
      <ion-button slot="end" color="warning" [routerLink]="['/dentistas-view', dentista.iddentista]">
        <ion-icon name="eye-outline"></ion-icon>
      </ion-button>
    </ion-item>
  </ion-list>
</ion-content>
