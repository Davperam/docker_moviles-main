<ion-header>
  <ion-toolbar>
    <ion-title>Lista de citas</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let cita of citas">
      <ion-label class="ion-text-wrap">
        <h2>{{ cita.motivo }}</h2>
        <p>{{ cita.fecha }} - {{ cita.horainicio }} to {{ cita.horafin }}</p>
      </ion-label>
      <ion-button slot="end" color="warning" [routerLink]="['/citas-veiw', cita.idcita]">
        <ion-icon name="eye-outline"></ion-icon>
      </ion-button>
    </ion-item>
  </ion-list>
</ion-content>
