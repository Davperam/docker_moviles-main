<ion-header>
  <ion-toolbar>
    <ion-title>Lista de expedientes clinicos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let expediente of expedientes">
      <ion-label class="ion-text-wrap">
        <h2>{{ expediente.idpaciente }}</h2>
        <p>{{ expediente.apertura }}</p>
      </ion-label>
      <ion-button slot="end" color="warning" [routerLink]="['/expedienteclinico-view', expediente.idexpediente]">
        <ion-icon name="eye-outline"></ion-icon>
      </ion-button>
    </ion-item>
  </ion-list>

  <ion-fab slot="fixed" vertical="bottom" horizontal="center">
    <ion-fab-button (click)="nuevoExpedienteclinico()" aria-label="Nuevo expediente clínico">
        <ion-icon name="add"></ion-icon>
    </ion-fab-button>
</ion-fab>

</ion-content>
