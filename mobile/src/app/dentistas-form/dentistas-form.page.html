<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button fill="solid" (click)="cerrarModal()">
        Cancelar
      </ion-button>
    </ion-buttons>

    <ion-title>
      {{ esEdicion ? 'Editar dentista' : 'Nuevo dentista' }}
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div *ngIf="cargando" class="ion-text-center ion-padding">
    <ion-spinner></ion-spinner>
    <p>Cargando dentista...</p>
  </div>

  <form *ngIf="dentistaForm && !cargando" [formGroup]="dentistaForm" (ngSubmit)="guardarDentista()">
    <ion-list>
      <!-- Nombre -->
      <ion-item>
        <ion-input label="Nombre" labelPlacement="stacked" type="text" formControlName="nombre" maxlength="50"></ion-input>
      </ion-item>
      <ion-note color="danger" *ngIf="getError('nombre') as error">
        {{ error }}
      </ion-note>

      <!-- Apellido Paterno -->
      <ion-item>
        <ion-input label="Apellido Paterno" labelPlacement="stacked" type="text" formControlName="paterno" maxlength="50"></ion-input>
      </ion-item>
      <ion-note color="danger" *ngIf="getError('paterno') as error">
        {{ error }}
      </ion-note>

      <!-- Apellido Materno -->
      <ion-item>
        <ion-input label="Apellido Materno" labelPlacement="stacked" type="text" formControlName="materno" maxlength="50"></ion-input>
      </ion-item>
      <ion-note color="danger" *ngIf="getError('materno') as error">
        {{ error }}
      </ion-note>

      <!-- Cédula -->
      <ion-item>
        <ion-input label="Cédula Profesional" labelPlacement="stacked" type="text" formControlName="cedula"></ion-input>
      </ion-item>
      <ion-note color="danger" *ngIf="getError('cedula') as error">
        {{ error }}
      </ion-note>

      <!-- Teléfono -->
      <ion-item>
        <ion-input label="Teléfono" labelPlacement="stacked" type="tel" formControlName="telefono" maxlength="10"></ion-input>
      </ion-item>
      <ion-note color="danger" *ngIf="getError('telefono') as error">
        {{ error }}
      </ion-note>

      <!-- Correo -->
      <ion-item>
        <ion-input label="Correo Electrónico" labelPlacement="stacked" type="email" formControlName="correo" maxlength="150"></ion-input>
      </ion-item>
      <ion-note color="danger" *ngIf="getError('correo') as error">
        {{ error }}
      </ion-note>

      <!-- Activo -->
      <ion-item>
        <ion-input label="Activo (1 o 0)" labelPlacement="stacked" type="number" formControlName="activo" min="0" max="1"></ion-input>
      </ion-item>
      <ion-note color="danger" *ngIf="getError('activo') as error">
        {{ error }}
      </ion-note>
    </ion-list>

    <ion-button fill="solid" expand="block" type="submit" class="ion-margin-top" [disabled]="guardando || cargando">
      {{ guardando ? 'Guardando...' : (esEdicion ? 'Actualizar' : 'Guardar') }}
    </ion-button>
  </form>
</ion-content>
