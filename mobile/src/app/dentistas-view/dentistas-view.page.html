<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/dentistas-list"></ion-back-button>
    </ion-buttons>
    <ion-title>Descripción del dentista</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-text color="danger" *ngIf="mensajeError">
    <p class="ion-padding">{{ mensajeError }}</p>
  </ion-text>
  
  <ion-card *ngIf="dentista as detalle">
    <ion-card-header>
      <ion-card-title>{{ detalle.nombre }} {{ detalle.paterno }} {{ detalle.materno }}</ion-card-title>
      <ion-card-subtitle>Cédula # {{ detalle.cedula }}</ion-card-subtitle>
      <ion-card-subtitle>Telefono # {{ detalle.telefono }}</ion-card-subtitle>
      <ion-card-subtitle>Correo # {{ detalle.correo }}</ion-card-subtitle>
    </ion-card-header>

  </ion-card>
</ion-content>
