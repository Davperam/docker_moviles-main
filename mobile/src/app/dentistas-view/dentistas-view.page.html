<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/dentistas-list"></ion-back-button>
    </ion-buttons>
    <ion-title>Detalles del dentista</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-text color="danger" *ngIf="mensajeError">
    <p class="ion-padding">{{ mensajeError }}</p>
  </ion-text>
  
  <ion-card *ngIf="dentista as detalle">
    <ion-card-header>
      <ion-card-title>{{ detalle.nombre }} {{ detalle.paterno }} {{ detalle.materno }}</ion-card-title>
      <ion-card-subtitle>Cédula # {{ detalle.cedula }}</ion-card-subtitle>
      <ion-card-subtitle>Telefono # {{ detalle.telefono }}</ion-card-subtitle>
      <ion-card-subtitle>Correo # {{ detalle.correo }}</ion-card-subtitle>
    </ion-card-header>

    <ion-card-content>
      <h2>Especialidades</h2>
      <ul *ngIf="detalle.especialidades?.length; else sinEspecialidades">
        <li *ngFor="let enlace of detalle.especialidades">{{ enlace.idespecialidad.nombre }}</li>
      </ul>
      <ng-template #sinEspecialidades><p>Sin especialidades registradas.</p></ng-template>
    </ion-card-content>

  </ion-card>
</ion-content>
