<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button fill="solid" (click)="cerrarModal()">
        Cancelar
      </ion-button>
    </ion-buttons>
    <ion-title>Nuevo expediente clinico</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form *ngIf="expedienteclinicoForm" [formGroup]="expedienteclinicoForm" (ngSubmit)="guardarExpediente()">
    <ion-list>
      <ion-item>
        <ion-input label="Enfermedades" labelPlacement="stacked" type="text" formControlName="enfermedades" maxlength="150"></ion-input>
      </ion-item>
      <ion-note color="danger" *ngIf="getError('nombre') as error">
        {{ error }}
      </ion-note>

      <ion-item>
        <ion-textarea label="Observaciones" labelPlacement="stacked" formControlName="observaciones" autoGrow="true"></ion-textarea>
      </ion-item>

    </ion-list>

    <ion-button fill="solid" expand="block" type="submit" class="ion-margin-top" [disabled]="guardando">
      {{ guardando ? 'Guardando...' : 'Guardar' }}
    </ion-button>
  </form>
</ion-content>
