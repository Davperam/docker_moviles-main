<app-view-toolbar 
  [nombre]="'Descripcion: ' + alergia?.nombre" 
  defaultHref="/alergia-list">
</app-view-toolbar>

<ion-content>
  <ion-text color="danger" *ngIf="mensajeError">
    <p class="ion-padding">{{ mensajeError }}</p>
  </ion-text>

  <ion-card *ngIf="alergia as detalle">
    <ion-card-header>
      <ion-card-title>{{ detalle.nombre }}</ion-card-title>
      <ion-card-subtitle>Descripción # {{ detalle.descripcion }}</ion-card-subtitle>
    </ion-card-header>

  </ion-card>
</ion-content>
