<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/metodopago-list"></ion-back-button>
    </ion-buttons>
    <ion-title>Descripción del método de pago</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-text color="danger" *ngIf="mensajeError">
    <p class="ion-padding">{{ mensajeError }}</p>
  </ion-text>
  
  <ion-card *ngIf="metodopago as detalle">
    <ion-card-header>
      <ion-card-title>{{ detalle.nombre }}</ion-card-title>
      <ion-card-subtitle>{{ detalle.descripcion }}</ion-card-subtitle>
    </ion-card-header>

  </ion-card>
</ion-content>
