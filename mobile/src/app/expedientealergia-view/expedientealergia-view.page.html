<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/expedientealergia-list"></ion-back-button>
    </ion-buttons>
    <ion-title>Descripción del expediente de alergia</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-text color="danger" *ngIf="mensajeError">
    <p class="ion-padding">{{ mensajeError }}</p>
  </ion-text>
  
  <ion-card *ngIf="expedienteAlergia as detalle">
    <ion-card-header>
      <ion-card-title>{{ detalle.idexpedientealergia }}</ion-card-title>
      <ion-card-subtitle>Alergia # {{ detalle.idalergia }}</ion-card-subtitle>
      <ion-card-subtitle>Numero expediente # {{ detalle.idexpediente }}</ion-card-subtitle>
    </ion-card-header>

  </ion-card>
</ion-content>
